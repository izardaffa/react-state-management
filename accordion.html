<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World</title>

    <style>
      * {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        color: #343a40;
        line-height: 1;
      }

      .accordion {
        width: 700px;
        margin: 100px auto;
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .item {
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.1);
        padding: 20px 24px;
        padding-right: 48px;
        cursor: pointer;
        border-top: 4px solid #fff;
        border-bottom: 4px solid #fff;

        display: grid;
        grid-template-columns: auto 1fr auto;
        column-gap: 24px;
        row-gap: 32px;
        align-items: center;
      }

      .number {
        font-size: 24px;
        font-weight: 500;
        color: #ced4da;
      }

      .title,
      .icon {
        font-size: 24px;
        font-weight: 500;
      }

      .content-box {
        grid-column: 2 / -1;
        padding-bottom: 16px;
        line-height: 1.6;
      }

      .content-box ul {
        color: #868e96;
        margin-left: 16px;
        margin-top: 16px;

        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      /* OPEN STATE */
      .open {
        border-top: 4px solid #526d82;
      }

      .open .number,
      .open .title {
        color: #526d82;
      }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;
      const faqs = [
        {
          question: "Apa itu ToDokeyo?",
          answer:
            "ToDokeyo merupakan aplikasi ToDo List yang dibuat menggunakan React JS.",
        },
        {
          question:
            "Apakah membutuhkan akun untuk menggunakan layanan tersebut?",
          answer:
            "Untuk saat ini layanan hanya dapat berjalan di sistem lokal sehingga data tidak tersimpan secara permanen.",
        },
        {
          question: "Apakah layanan tersebut dapat digunakan secara gratis?",
          answer: "Ya, layanan tersebut dapat digunakan secara gratis!",
        },
      ];

      function MyApp() {
        return (
          <div>
            <Accordion data={faqs} />
          </div>
        );
      }

      function Accordion({ data }) {
        const [curOpen, setIsOpen] = useState(null);

        return (
          <div className="accordion">
            {data.map((faq, index) => (
              <AccordionItem
                key={index}
                curOpen={curOpen}
                onOpen={setIsOpen}
                question={faq.question}
                answer={faq.answer}
                number={index + 1}
              />
            ))}
          </div>
        );
      }

      function AccordionItem({ number, question, answer, curOpen, onOpen }) {
        const isOpen = number === curOpen;

        function handleToggle() {
          onOpen(isOpen ? null : number);
        }

        return (
          <div
            className={`item ${isOpen ? "open" : ""}`}
            onClick={handleToggle}
          >
            <p className="number">{number < 10 ? `0${number}` : number}</p>
            <p className="title">{question}</p>
            <p className="icon">{isOpen ? "-" : "+"}</p>
            {isOpen && <div className="content-box">{answer}</div>}
          </div>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<MyApp />);
    </script>
    <!--
      Note: this page is a great way to try React but it's not suitable for production.
      It slowly compiles JSX with Babel in the browser and uses a large development build of React.

      Read this page for starting a new React project with JSX:
      https://react.dev/learn/start-a-new-react-project

      Read this page for adding React with JSX to an existing project:
      https://react.dev/learn/add-react-to-an-existing-project
    -->
  </body>
</html>
