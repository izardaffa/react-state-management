<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Hello World</title>

    <style>
      .App {
        text-align: center;
        padding-top: 2rem;
      }

      h1 {
        font-size: 2.5rem;
        margin-bottom: 2rem;
      }

      input[type="color"] {
        margin-bottom: 2rem;
      }

      .color-box {
        width: 200px;
        height: 200px;
        margin: 2rem auto;
      }

      input[type="range"] {
        width: 300px;
        margin-bottom: 2rem;
      }

      .color-info {
        margin-top: 1rem;
      }

      pre {
        text-align: start;
        margin: auto;
        display: inline-block;
      }
    </style>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Don't use this in production: -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useState } = React;

      function MyApp() {
        const [color, setColor] = useState("#000000");
        const [opacity, setOpacity] = useState(1);

        const handleColorChange = (e) => {
          setColor(e.target.value);
        };

        const handleOpacityChange = (e) => {
          const opacityValue = Number(e.target.value);
          setOpacity(opacityValue);
        };

        const getOpacityPercentage = () => {
          const opacityPercentage = Math.round(opacity * 100);
          return `${opacityPercentage}%`;
        };

        const getRGB = () => {
          const red = parseInt(color.slice(1, 3), 16);
          const green = parseInt(color.slice(3, 5), 16);
          const blue = parseInt(color.slice(5, 7), 16);

          return opacity == 1
            ? `rgb(${red}, ${green}, ${blue})`
            : `rgba(${red}, ${green}, ${blue}, ${opacity})`;
        };

        const getCSSCode = () => {
          const cssCode = `
            background-color: ${color};
opacity: ${opacity};
/* Add other style here */
          `;

          return cssCode.trim();
        };

        return (
          <div className="App">
            <h1>Color Code Generator</h1>
            <input type="color" value={color} onChange={handleColorChange} />
            <br />
            <input
              type="range"
              min="0"
              max="1"
              step="0.1"
              value={opacity}
              onChange={handleOpacityChange}
            />

            {color && (
              <div
                className="color-box"
                style={{ backgroundColor: color, opacity: opacity }}
              ></div>
            )}

            {color && (
              <div className="color-info">
                <p>Hex: {color}</p>
                <p>RGB: {getRGB()}</p>
                <p>Opacity: {getOpacityPercentage()}</p>
                <p>CSS:</p>
                <pre>
                  <code>{getCSSCode()}</code>
                </pre>
              </div>
            )}
          </div>
        );
      }

      const container = document.getElementById("root");
      const root = ReactDOM.createRoot(container);
      root.render(<MyApp />);
    </script>
    <!--
      Note: this page is a great way to try React but it's not suitable for production.
      It slowly compiles JSX with Babel in the browser and uses a large development build of React.

      Read this page for starting a new React project with JSX:
      https://react.dev/learn/start-a-new-react-project

      Read this page for adding React with JSX to an existing project:
      https://react.dev/learn/add-react-to-an-existing-project
    -->
  </body>
</html>
